# https://taskfile.dev

version: "3"

vars:
  PACKAGES: [gh-checks, help]

tasks:
  fmt:
    desc: Run gofumpt for all packages
    cmds:
      - for: { var: PACKAGES }
        cmd: cd {{.ITEM}} && gofmt -s -w .

  modernize:
    desc: Run modernize for all packages
    cmds:
      - for: { var: PACKAGES }
        cmd: cd {{.ITEM}} && modernize -fix ./...

  lint:
    desc: Run base linters for all packages
    cmds:
      - for: { var: PACKAGES }
        cmd: cd {{.ITEM}} && golangci-lint run

  test:
    desc: Run tests for all packages
    cmds:
      - for: { var: PACKAGES }
        cmd: cd {{.ITEM}} && go test ./... {{.CLI_ARGS}}

  tidy:
    desc: Run `go mod tidy` for all packages
    cmds:
      - for: { var: PACKAGES }
        cmd: cd {{.ITEM}} && go mod tidy

  publish:
    cmds:
      - git tag gh-checks/$(gum input)
      - git push --tags
      - GOPROXY=proxy.golang.org go list -m github.com/dlvhdr/x/gh-checks@$(gum input)
